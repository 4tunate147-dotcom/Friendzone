{% extends "base.html" %}
{% block tittle %} Edit Friend List Page{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Friend</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>

<div class="container mt-5">

    <div class="col-md-8 mx-auto">

        <div class="card">

            <div class="card-header">
                <h1>Edit Friend</h1>
            </div>

            <div class="card-body">

                <form method="post"
                      enctype="multipart/form-data">

                    <!-- Name -->
                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ friend.name }}"
                        >

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ friend.email }}"
                        >

                    </div>

                    <!-- Birthday -->
                    <div class="mb-3">

                        <label class="form-label">
                            Birthday
                        </label>

                        <input
                            type="date"
                            name="birthday"
                            class="form-control"
                            value="{{ friend.birthday }}"
                        >

                    </div>

                    <!-- Upload -->
                    <div class="mb-3">

                        <label class="form-label">
                            Upload New Picture
                        </label>

                        <input
                            type="file"
                            name="upload"
                            class="form-control"
                        >

                    </div>

                    <button class="btn btn-success">
                        Update Friend
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
{% endblock %}
